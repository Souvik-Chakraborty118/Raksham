<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Raksham - Live Emergency Tracking</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=2">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
</head>
<body>
    <div class="track-wrap">
        <img src="raksham_logo.jpeg" alt="Raksham Logo" class="track-logo">
        <h1 class="track-title"> Live Emergency Tracking</h1>

        <div class="track-status-card">
            <span id="track-status-main">🟡 Connecting to victim's GPS signal...</span>
            <span id="track-status-sub" class="track-status-sub">Checking latest coordinates...</span>
        </div>

        <div id="track-map-box" class="track-map-box track-hidden">
            <div id="live-map"></div>
            <div id="track-coords-display" class="track-coords"></div>
        </div>

        <div class="track-actions">
            <a id="track-maps-btn" class="track-btn-maps track-hidden" href="#" target="_blank" rel="noopener">
                 OPEN LIVE DIRECTIONS IN GOOGLE MAPS
            </a>
            <a href="tel:112" class="track-btn-112">📞 CALL 112 EMERGENCY HELPLINE</a>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="script.js?v=8"></script>
</body>
</html>
